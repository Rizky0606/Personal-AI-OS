name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Tes integrasi gateway memakai Postgres nyata; di CI tidak boleh dilewati.
      TEST_DATABASE_URL: postgres://aios:${{ secrets.CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint bukan task turbo (tidak otomatis ^build seperti typecheck/test); packages/roles dkk.
      # impor dari @aios/contracts yang perlu dist/ ter-build dulu, kalau tidak type resolution
      # eslint rusak (ribuan "Unsafe ..." palsu).
      - run: pnpm build
      - name: Uji mandiri skrip backup, restore, dan cek versi (perintah palsu)
        run: bash infra/scripts/selftest.sh
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # E2E desktop (UI asli + gateway, worker, Postgres nyata; layanan eksternal palsu). Uji run coding
  # dilewati bila omp tidak terpasang di runner.
  e2e-desktop:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aios
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BROWSER: chrome
      # Binary Postgres tertanam butuh ICU lama yang tidak ada di runner (lihat e2e/harness/stack.ts);
      # pakai servis Postgres nyata, sama seperti job "check".
      TEST_DATABASE_URL: postgres://aios:${{ secrets.CI_POSTGRES_PASSWORD }}@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bangun paket yang dipakai harness
        run: |
          pnpm --filter @aios/contracts build
          pnpm --filter @aios/adapters build
          pnpm --filter @aios/roles build
      - run: pnpm --filter @aios/e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-hasil
          path: e2e/test-results

  # Memverifikasi Dockerfile dan compose (tidak bisa dibangun di mesin tanpa Docker).
  gateway-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build image gateway
        run: docker build -f apps/gateway/Dockerfile -t aios-gateway:ci .
      - name: Image berjalan sebagai non-root dan berisi migrasi
        run: |
          test "$(docker run --rm --entrypoint id aios-gateway:ci -u)" != "0"
          docker run --rm --entrypoint ls aios-gateway:ci drizzle/0000_init.sql
      - name: Gateway gagal cepat tanpa DATABASE_URL
        run: |
          if docker run --rm aios-gateway:ci; then exit 1; fi
      - name: Validasi compose
        working-directory: infra/compose
        env:
          SEARXNG_TAG: ci
          SEARXNG_SECRET: ci
          KUMA_TAG: ci
        run: |
          mkdir -p secrets && echo ci > secrets/pg_password && touch gateway.env
          docker compose config --quiet
          docker compose --profile monitoring config --quiet
