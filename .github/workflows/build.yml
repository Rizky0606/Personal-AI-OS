name: Build dan Rilis

# Satu alur untuk installer Windows dan APK Android:
# - push ke main (termasuk PR yang di-merge): versi naik otomatis (patch +1 dari tag terakhir, atau tag yang sudah
#   menempel di commit itu bila dibuat infra/scripts/release.mjs), Desktop dan Android dibangun PARALEL, lalu rilis
#   diterbitkan (bukan draf) sehingga auto-update Windows langsung melihatnya.
# - pull request: Desktop dan Android dibangun paralel sebagai artefak uji, tanpa rilis.
# Tag dibuat di job rilis (setelah kedua build lulus), jadi build gagal tidak menghabiskan nomor versi. Tag yang dibuat
# GITHUB_TOKEN tidak memicu workflow lain, karena itu semua langkah ada di satu workflow ini.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write # membuat tag dan rilis; hanya dipakai job rilis di main

# Rilis berurutan: dua push berdekatan tidak berebut nomor versi (Desktop dan Android tetap paralel di dalamnya).
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'rilis-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  versi:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      code: ${{ steps.v.outputs.code }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tentukan versi
        id: v
        shell: bash
        run: |
          git fetch --tags --force --quiet
          last="$(git tag --list 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          last="${last:-v0.0.0}"
          IFS=. read -r major minor patch <<< "${last#v}"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            version="${last#v}-pr.${{ github.event.number }}"
            publish=false
          else
            head_tag="$(git tag --points-at HEAD --list 'v*' --sort=-v:refname | head -n1)"
            if [[ -n "$head_tag" ]]; then
              version="${head_tag#v}"          # release.mjs sudah menetapkan versi untuk commit ini
              IFS=. read -r major minor patch <<< "$version"
            else
              patch=$((patch + 1))
              version="$major.$minor.$patch"
            fi
            publish=true
          fi
          # versionCode Android naik mengikuti versi (Android hanya memasang menimpa bila kodenya lebih tinggi).
          code=$((major * 1000000 + minor * 1000 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Versi: $version (versionCode $code), rilis: $publish"

  desktop:
    needs: versi
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.versi.outputs.version }}
      PUBLISH: ${{ needs.versi.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: pnpm install --frozen-lockfile
      # Paket workspace dipakai lewat dist/; bangun dulu supaya tes dan bundel Bun menemukannya.
      - name: Bangun paket kontrak dan adapter
        run: |
          pnpm --filter @aios/contracts build
          pnpm --filter @aios/adapters build
      - name: Tes UI desktop
        run: pnpm --filter @aios/desktop test
      # tauri-build mewajibkan sidecar (externalBin) ada saat kompilasi, jadi worker dibangun lebih dulu.
      - name: Bangun sidecar worker (Bun)
        run: pnpm --filter @aios/worker build:sidecar
      - name: Uji asap sidecar
        run: pnpm --filter @aios/worker smoke:sidecar
      - name: Cek Rust (clippy dan tes)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Rilis: versi dan updater disuntikkan lewat config tambahan (tauri.conf.json tetap berisi placeholder). Kunci
      # privat penanda tangan hanya ada sebagai secret Actions. Build PR memakai versi di tauri.conf.json, tanpa updater.
      - name: Siapkan config rilis (versi dan updater)
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$UPDATER_PUBKEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "secret TAURI_UPDATER_PUBKEY dan TAURI_SIGNING_PRIVATE_KEY wajib untuk rilis"; exit 1; }
          node -e 'const fs=require("fs");fs.writeFileSync("apps/desktop/src-tauri/tauri.release.conf.json",JSON.stringify({version:process.env.VERSION,bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.UPDATER_PUBKEY,endpoints:["https://github.com/"+process.env.GITHUB_REPOSITORY+"/releases/latest/download/latest.json"],windows:{installMode:"passive"}}}}))'
          echo "TAURI_CONFIG_ARGS=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_ENV"

      - name: Bangun installer NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Alamat gateway tertanam di installer (bukan rahasia); layar login tidak lagi meminta alamat.
          VITE_GATEWAY_URL: ${{ vars.AIOS_GATEWAY_URL || 'https://ai.ojixx.my.id' }}
        shell: bash
        run: pnpm --filter @aios/desktop tauri build $TAURI_CONFIG_ARGS

      - name: Susun latest.json untuk updater
        if: env.PUBLISH == 'true'
        shell: bash
        run: node infra/scripts/make-latest-json.mjs --version "$VERSION" --repo "$GITHUB_REPOSITORY" --dir apps/desktop/src-tauri/target/release/bundle/nsis --out apps/desktop/src-tauri/target/release/bundle/nsis/latest.json

      - uses: actions/upload-artifact@v7
        with:
          name: aios-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error

  android:
    needs: versi
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    env:
      # Keystore dan google-services.json hanya ada bila secret diisi; tanpa itu build tetap jalan.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      VERSION_ARGS: -PaiosVersionCode=${{ needs.versi.outputs.code }} -PaiosVersionName=${{ needs.versi.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Pasang google-services.json (opsional, untuk push FCM)
        if: env.HAS_FIREBASE == 'true'
        run: echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Pasang keystore rilis (opsional)
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Lint dan tes unit
        run: ./gradlew check

      - name: APK debug (selalu bisa dipasang)
        run: ./gradlew assembleDebug $VERSION_ARGS

      # Kunci tetap dari secret: APK ini bisa dipasang menimpa versi sebelumnya tanpa uninstall. APK debug
      # ditandatangani kunci acak per runner, jadi tidak bisa menimpa APK dari build lain.
      - name: APK release bertanda tangan
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease $VERSION_ARGS

      - uses: actions/upload-artifact@v7
        with:
          name: aios-android-apk
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  rilis:
    needs: [versi, desktop, android]
    if: needs.versi.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Daftar berkas rilis
        run: ls -la dist
      # Membuat tag vX.Y.Z di commit ini (bila belum ada) dan menerbitkan rilis sebagai "latest".
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.versi.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.versi.outputs.version }}
          generate_release_notes: true
          make_latest: true
          draft: false
          # APK berada di subfolder debug/ dan release/ (struktur artefak Android).
          files: |
            dist/*.exe
            dist/*.sig
            dist/latest.json
            dist/**/*.apk
          fail_on_unmatched_files: true
