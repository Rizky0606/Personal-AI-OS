name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/worker/**'
      - 'packages/contracts/**'
      - 'packages/ui-tokens/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write # hanya dipakai untuk rilis draf pada tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: pnpm install --frozen-lockfile
      # Paket workspace dipakai lewat dist/; bangun dulu supaya tes dan bundel Bun menemukannya.
      - name: Bangun paket kontrak dan adapter
        run: |
          pnpm --filter @aios/contracts build
          pnpm --filter @aios/adapters build
      - name: Tes UI desktop
        run: pnpm --filter @aios/desktop test
      # tauri-build mewajibkan sidecar (externalBin) ada saat kompilasi, jadi worker dibangun lebih dulu.
      - name: Bangun sidecar worker (Bun)
        run: pnpm --filter @aios/worker build:sidecar
      - name: Uji asap sidecar
        run: pnpm --filter @aios/worker smoke:sidecar
      - name: Cek Rust (clippy dan tes)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Bangun installer NSIS
        run: pnpm --filter @aios/desktop tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: aios-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Rilis draf pada tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
