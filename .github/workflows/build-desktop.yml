name: Build Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'apps/desktop/**'
      - 'apps/worker/**'
      - 'packages/contracts/**'
      - 'packages/ui-tokens/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write # hanya dipakai untuk rilis draf pada tag

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: pnpm install --frozen-lockfile
      # Paket workspace dipakai lewat dist/; bangun dulu supaya tes dan bundel Bun menemukannya.
      - name: Bangun paket kontrak dan adapter
        run: |
          pnpm --filter @aios/contracts build
          pnpm --filter @aios/adapters build
      - name: Tes UI desktop
        run: pnpm --filter @aios/desktop test
      # tauri-build mewajibkan sidecar (externalBin) ada saat kompilasi, jadi worker dibangun lebih dulu.
      - name: Bangun sidecar worker (Bun)
        run: pnpm --filter @aios/worker build:sidecar
      - name: Uji asap sidecar
        run: pnpm --filter @aios/worker smoke:sidecar
      - name: Cek Rust (clippy dan tes)
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      # Build tag: updater aktif. Kunci privat penanda tangan hanya ada sebagai secret Actions (tidak pernah di repo).
      # Kunci publik dan repo rilis disuntikkan lewat config tambahan, jadi tauri.conf.json tetap berisi placeholder.
      - name: Siapkan config rilis (updater)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$UPDATER_PUBKEY" && test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "secret TAURI_UPDATER_PUBKEY dan TAURI_SIGNING_PRIVATE_KEY wajib untuk rilis"; exit 1; }
          node -e 'const fs=require("fs");const v=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync("apps/desktop/src-tauri/tauri.release.conf.json",JSON.stringify({version:v,bundle:{createUpdaterArtifacts:true},plugins:{updater:{pubkey:process.env.UPDATER_PUBKEY,endpoints:["https://github.com/"+process.env.GITHUB_REPOSITORY+"/releases/latest/download/latest.json"],windows:{installMode:"passive"}}}}))'
          echo "TAURI_CONFIG_ARGS=--config src-tauri/tauri.release.conf.json" >> "$GITHUB_ENV"

      - name: Bangun installer NSIS
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Alamat gateway tertanam di installer (bukan rahasia); layar login tidak lagi meminta alamat.
          VITE_GATEWAY_URL: ${{ vars.AIOS_GATEWAY_URL || 'https://ai.ojixx.my.id' }}
        shell: bash
        run: pnpm --filter @aios/desktop tauri build $TAURI_CONFIG_ARGS

      - name: Susun latest.json untuk updater
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node infra/scripts/make-latest-json.mjs --version "${GITHUB_REF_NAME#v}" --repo "$GITHUB_REPOSITORY" --dir apps/desktop/src-tauri/target/release/bundle/nsis --out apps/desktop/src-tauri/target/release/bundle/nsis/latest.json

      - uses: actions/upload-artifact@v4
        with:
          name: aios-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Rilis draf pada tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/latest.json
