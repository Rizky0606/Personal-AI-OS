[package]
name = "aios-desktop"
version = "0.1.0"
description = "Personal AI OS untuk Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aios_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-websocket = "2"
# Windows Credential Manager untuk token. Hanya backend native Windows; tanpa fallback ke berkas.
keyring = { version = "3", features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
